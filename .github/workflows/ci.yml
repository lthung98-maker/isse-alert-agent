name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        # The whole suite runs offline against fakes - no Azure, no ServiceDesk,
        # no credentials. The contract test (test_cas_contract.py) is the one that
        # must never regress: it pins the payload shape ISSE reads.
        run: pytest -q
