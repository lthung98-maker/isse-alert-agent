[project]
name = "isse-alert-agent"
version = "0.1.0"
description = "ISSE Alert Agent - files one ServiceDesk request per new Azure Monitor alert."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "httpx>=0.27",
    "pyyaml>=6",
    "typer>=0.12",
    "azure-identity>=1.17",
    "azure-mgmt-alertsmanagement>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
isse-alerts = "isse_alert_agent.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pinned rather than ruff's default, which widens between releases and would turn a
# routine upgrade into a red build.
select = ["E", "F", "W", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
